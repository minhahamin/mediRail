<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediRail Eval</title>
<style>
  :root{--bg:#f4f5f2;--card:#fff;--g:#8fb08c;--gd:#3e6b4a;--gl:#dce8d8;--ink:#23392b;--warn:#d98a7b}
  @media (prefers-color-scheme:dark){:root{--bg:#1a221c;--card:#222d25;--g:#5f8a66;--gd:#a9cfae;--gl:#2c3a2f;--ink:#e4efe6;--warn:#e29a8b}}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif;
    background-image:linear-gradient(#0000 23px,#8fb08c22 24px),linear-gradient(90deg,#0000 23px,#8fb08c22 24px);background-size:24px 24px}
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px}
  .win{background:var(--card);border:2px solid var(--gd);border-radius:16px;box-shadow:4px 4px 0 var(--g);overflow:hidden}
  .bar{background:var(--g);color:#fff;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gd)}
  .body{padding:16px}
  h1{margin:0;font-size:22px}
  .prog{height:14px;border:2px solid var(--gd);border-radius:99px;background:var(--gl);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--g);width:0;transition:width .4s}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:7px 8px;border-bottom:1px dashed var(--g);text-align:left;white-space:nowrap}
  .scroll{overflow-x:auto}
  .log{font:12.5px/1.6 ui-monospace,Consolas,monospace;max-height:220px;overflow:auto;background:var(--gl);border-radius:10px;padding:10px}
  .pill{display:inline-block;padding:1px 9px;border-radius:99px;border:1.5px solid var(--gd);font-size:12px}
  .ok{background:var(--gl)} .bad{background:#d98a7b33;border-color:var(--warn)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--g);display:inline-block;margin-right:6px}
  .run .dot{animation:p 1s infinite} @keyframes p{50%{opacity:.25}}
  details{margin:4px 0} summary{cursor:pointer}
  pre{white-space:pre-wrap;margin:6px 0 0;font:12.5px/1.5 inherit}
  .note{font-size:12.5px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="win"><div class="bar"><span>✦ MediRail · 평가 대시보드</span><span id="upd">…</span></div>
    <div class="body"><h1 id="status">대기 중</h1><div class="prog"><i id="pbar"></i></div>
    <p class="note">규칙 기반 채점 · 응답 캐시 · 예산 상한 적용 · 2초마다 자동 갱신</p></div></div>

  <div class="win"><div class="bar"><span>모델 비교</span><span>×</span></div>
    <div class="body scroll"><table id="cmp"></table></div></div>

  <div class="win"><div class="bar"><span>실시간 로그</span><span>×</span></div>
    <div class="body"><div class="log" id="log"></div></div></div>

  <div class="win"><div class="bar"><span>문항별 결과</span><span>×</span></div>
    <div class="body" id="rows"></div></div>
</div>
<script>
const pct=x=>x==null?'-':Math.round(x*100)+'%';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function tick(){
  try{
    const s=await (await fetch('results/state.json',{cache:'no-store'})).json();
    document.getElementById('upd').textContent='갱신 '+s.updated;
    const ms=Object.entries(s.models);
    const done=ms.reduce((a,[,m])=>a+m.n,0);
    document.getElementById('status').innerHTML=(s.running?'<span class="run"><span class="dot"></span>평가 진행 중</span>':'완료/대기')+` · ${done}건 채점됨`;
    document.getElementById('pbar').style.width=Math.min(100,s.total?done/s.total*100:0)+'%';
    document.getElementById('cmp').innerHTML='<tr><th>모델</th><th>문항</th><th>정확도</th><th>근거인용</th><th>환각률↓</th><th>거절정확</th><th>안전문구</th><th>비용$</th><th>지연s</th></tr>'+
      ms.map(([id,m])=>`<tr><td><b>${esc(id)}</b></td><td>${m.n}</td><td>${pct(m.acc)}</td><td>${pct(m.cite)}</td><td>${pct(m.halluc)}</td><td>${pct(m.refusal_ok)}</td><td>${pct(m.safety)}</td><td>${m.cost}</td><td>${m.latency??'-'}</td></tr>`).join('');
    const lg=document.getElementById('log');lg.innerHTML=s.log.map(esc).join('<br>');lg.scrollTop=lg.scrollHeight;
    document.getElementById('rows').innerHTML=ms.map(([id,m])=>`<h3>${esc(id)}</h3>`+Object.values(m.rows).map(r=>
      `<details><summary><span class="pill ${r.s.acc>=1?'ok':'bad'}">${r.id}</span> ${esc(r.cat)} · acc ${pct(r.s.acc)} · 환각 ${r.s.halluc?'⚠':'–'} · ${esc(r.q)}</summary><pre>${esc(r.answer)}</pre></details>`).join('')).join('');
  }catch(e){document.getElementById('status').textContent='아직 결과 없음 (python eval/run_eval.py 실행 대기)'}
}
tick();setInterval(tick,2000);
</script>
</body>
</html>
