name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 푸시가 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-sqlite:
    name: 백엔드 테스트 (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  backend-postgres:
    name: 백엔드 테스트 (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medirail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEDIRAIL_TEST_DB: postgres
      MEDIRAIL_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/medirail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: pytest (같은 테스트 전체를 실제 PostgreSQL에서)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: 프론트 타입 검사 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Playwright 브라우저 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E 실행 (가짜 LLM, 임시 DB, 실제 프로덕션 빌드)
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npx playwright test
      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  secrets:
    name: 비밀 정보 유입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 저장소에 키·개인 메모가 들어가지 않았는지 확인
        run: |
          # 워크플로 자신(.github)은 검사 패턴을 포함하므로 제외한다
          if git grep -nIE 'sk-or-v1-[A-Za-z0-9]{24,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|serviceKey=[A-Za-z0-9%]{40,}' -- . ':!.github'; then
            echo "::error::API 키 또는 개인 키로 보이는 문자열이 저장소에 있습니다"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|참고.*\.txt$'; then
            echo "::error::.env 또는 개인 메모 파일이 커밋되어 있습니다"; exit 1
          fi
          echo "OK: 비밀 정보 없음"
